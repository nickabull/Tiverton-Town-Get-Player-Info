name: Update Tiverton fixtures and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '30 23 * * *'
      timezone: 'Europe/London'
    - cron: '30 7 * * *'
      timezone: 'Europe/London'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Excel dependency
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Update fixture data
        shell: pwsh
        run: '& "./Update Tiverton Fixtures.cloud.ps1"'

      - name: Build Excel download
        shell: pwsh
        run: python ./generate_excel.py

      - name: Prepare website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site | Out-Null
          Copy-Item index.html,data.js,data.json,tiverton-town-logo.png,Tiverton_Town_SL1_Fixtures_2026-27.xlsx -Destination _site
          New-Item -ItemType File -Force -Path _site/.nojekyll | Out-Null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
