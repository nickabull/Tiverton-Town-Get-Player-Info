name: Update Tiverton fixtures and publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *' # Hourly report discovery; full fixture refresh stays twice daily.
    - cron: '30 23 * * *'
      timezone: 'Europe/London'
    - cron: '30 7 * * *'
      timezone: 'Europe/London'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install data dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Update fixture data
        if: github.event_name != 'push' && github.event.schedule != '17 * * * *'
        shell: pwsh
        run: '& "./Update Tiverton Fixtures.cloud.ps1"'

      - name: Apply verified official match reports
        if: github.event_name != 'push'
        shell: pwsh
        run: python ./apply_verified_reports.py

      - name: Discover published Darren match reports
        shell: pwsh
        run: python ./refresh_match_reports.py

      - name: Retain discovered report links
        shell: pwsh
        run: |
          git config user.name "Tivvy Match Centre"
          git config user.email "actions@users.noreply.github.com"
          git add match-report-links.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Retain discovered official match report links"
            git push origin HEAD:main
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh Southern League attendances
        shell: pwsh
        run: python ./league_attendances.py

      - name: Build Excel download
        if: github.event_name != 'push' && github.event.schedule != '17 * * * *'
        shell: pwsh
        run: python ./generate_excel.py

      - name: Prepare website
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site | Out-Null
          Copy-Item match-status-shared.js,player-profiles.js,player-profiles.css,match-report-links.json,index.html,season-so-far.html,stats-centre.html,programme-player-stats.html,data.js,data.json,cup-match-details-2026-27.json,historical-match-details-2026-27.json,match-centre-fixtures-2026-27.json,tivvy-match-centre.html,tivvy-match-centre-desktop-preview.html,tivvy-hub-preview.html,match-centre-league-table.html,tivvy-v3-fixtures.html,tiverton-town-logo.png,Tiverton_Town_SL1_Fixtures_2026-27.xlsx -Destination _site
          New-Item -ItemType File -Force -Path _site/.nojekyll | Out-Null

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
