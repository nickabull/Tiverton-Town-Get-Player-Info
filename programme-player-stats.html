<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiverton Town Player Stats</title>
<style>
:root{--yellow:#f2c400;--black:#111;--white:#fff;--line:#7a7a7a;--ink:#111;--stripe:#fff4b8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#ddd;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.page{width:794px;height:1123px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
.top{height:172px;background:var(--yellow);clip-path:polygon(0 0,100% 0,100% 68%,0 100%);position:relative}
.title{position:absolute;left:150px;top:42px;font-size:74px;line-height:.9;font-weight:1000;letter-spacing:-2px;text-transform:uppercase;transform:rotate(-4deg)}
.body{position:absolute;left:36px;right:36px;top:190px;bottom:80px}
.kicker{text-align:center;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:22px}
table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #777;font-size:14px}
th,td{border:1px solid #777;padding:7px 6px;line-height:1.1;height:30px}
th{background:#111;color:#fff;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:.02em}
tbody tr:nth-child(odd) td{background:var(--stripe)}
tbody tr:nth-child(even) td{background:#fff}
td:first-child,th:first-child{text-align:left;font-weight:800}
td:not(:first-child),th:not(:first-child){text-align:center}
th:nth-child(1){width:34%}
th:nth-child(2),th:nth-child(3),th:nth-child(4),th:nth-child(6),th:nth-child(7){width:10%}
th:nth-child(5){width:16%}
.goals{font-weight:900}
.footer{position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--yellow)}
.note{font-size:10px;color:#555;margin-top:10px;text-align:left}
</style>
</head>
<body>
<main class="page" data-document-role="page" data-label="Player Stats">
  <div class="top"><div class="title">Player Stats</div></div>
  <section class="body">
    <div class="kicker">Southern League Division One South</div>
    <table aria-label="Tiverton Town player statistics">
      <thead><tr>
        <th>Player</th><th>Starts</th><th>Sub Apps</th><th>Total Apps</th><th>Minutes</th><th>Goals</th><th>Captaincies</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="7">Loading player statistics…</td></tr></tbody>
    </table>
    <div class="note" id="updated"></div>
  </section>
  <div class="footer"></div>
</main>
<script src="data.js"></script>
<script>
const data=window.TIVVY_DATA||{fixtures:[]};
const parseScore=s=>/^\d+\s*[-–]\s*\d+$/.test(String(s||''));
const minute=v=>{const m=String(v||'').match(/^(\d{1,3})(?:\+(\d{1,2}))?$/);return m?+m[1]+ +(m[2]||0):null};
const completed=(data.fixtures||[]).filter(x=>String(x.comp||data.comp||'SL1').toUpperCase()==='SL1' && x.result && parseScore(x.result)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const stats=new Map();
function get(name){name=String(name||'').trim();if(!stats.has(name))stats.set(name,{name,starts:0,subs:0,apps:0,mins:0,goals:0,caps:0});return stats.get(name)}
for(const fx of completed){
  const st=Array.isArray(fx.starterDetails)?fx.starterDetails:[];
  const sb=Array.isArray(fx.subDetails)?fx.subDetails:[];
  const ev=[...st,...sb].flatMap(p=>[minute(p.offMinute),minute(p.onMinute),...(Array.isArray(p.goalMinutes)?p.goalMinutes.map(minute):[])]).filter(Number.isFinite);
  const end=Math.max(90,...ev);
  for(const p of st){
    if(!p?.name)continue;
    const r=get(p.name); r.starts++; r.apps++; r.goals+=Number(p.goalCount||0); if(p.captain)r.caps++;
    const off=minute(p.offMinute); r.mins+=Number.isFinite(off)?Math.min(off,end):end;
  }
  for(const p of sb){
    if(!p?.name)continue;
    const used=p.used!==false && (p.onMinute || p.used===true);
    const r=get(p.name);
    if(used){r.subs++;r.apps++;const on=minute(p.onMinute);if(Number.isFinite(on))r.mins+=Math.max(0,end-on)}
    r.goals+=Number(p.goalCount||0); if(p.captain)r.caps++;
  }
}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rows=[...stats.values()].filter(x=>x.apps>0).sort((a,b)=>b.apps-a.apps||b.starts-a.starts||b.mins-a.mins||a.name.localeCompare(b.name));
document.getElementById('rows').innerHTML=rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.starts+'</td><td>'+r.subs+'</td><td><strong>'+r.apps+'</strong></td><td>'+r.mins+'</td><td class="goals">'+r.goals+'</td><td>'+r.caps+'</td></tr>').join('');
document.getElementById('updated').textContent='SL1 appearances from the current Player Info data · '+completed.length+' completed league matches'+(data.updated?' · updated '+data.updated:'');
</script>
</body>
</html>
